
{% extends "base.html" %}

{% block title %}Login | MediBook{% endblock %}

{% block content %}
<section class="auth-page">
    <div class="auth-card">

        <div class="form-heading">
            <span class="form-heading-icon">+</span>
            <div>
                <h2>Welcome Back</h2>
                <p>Sign in to your MediBook account</p>
            </div>
        </div>

        <p>
            Access your account to manage your healthcare appointments.
        </p>

        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    maxlength="120"
                    autocomplete="email"
                    placeholder="Enter your email address"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="current-password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit" class="btn btn-primary form-submit">
                Log In →
            </button>
        </form>

        <a class="auth-link" href="{{ url_for('signup') }}">
            Don't have an account? Create one
        </a>

        <a class="form-back-link" href="{{ url_for('home') }}">
            ← Back to Home
        </a>

    </div>
</section>
{% endblock %}
